services:
  # 1. Auth Service
  - type: web
    name: hackwave-auth-service
    env: node
    rootDir: services/auth_services
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_PRIVATE_KEY_BASE64
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 2. Main Service
  - type: web
    name: hackwave-main-service
    env: node
    rootDir: services/main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: hackwave-auth-service
          property: host
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: hackwave-ai-service
          property: host

  # 3. AI Scanning Service
  - type: web
    name: hackwave-ai-service
    env: python
    rootDir: services/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_PUBLIC_KEY_BASE64
        sync: false

  # 4. Frontend Web App
  - type: web
    name: hackwave-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: hackwave-main-service
          property: host
      - key: NEXT_PUBLIC_AUTH_URL
        fromService:
          type: web
          name: hackwave-auth-service
          property: host
